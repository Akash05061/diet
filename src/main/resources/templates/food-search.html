<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Food Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <h2 class="text-center mb-4">🔍 Food Macro Search</h2>

    <form method="post" action="/food/search" class="text-center">
        <input type="text" name="input" class="form-control w-50 mx-auto mb-3"
               placeholder="Enter like: 100g chicken" required>
        <button class="btn btn-primary px-4">Search</button>
    </form>

    <p th:if="${error}" class="text-danger text-center mt-3" th:text="${error}"></p>
</div>

</body>
</html>
