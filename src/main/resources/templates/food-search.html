<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Food Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container py-5">
    <h2 class="text-center fw-bold mb-4">🔍 Search Food Nutrition</h2>

    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <form method="post" action="/food/search">
            <input type="text" name="input" class="form-control mb-3"
                   placeholder="Example: 100g chicken, 2 eggs, 150g paneer" required>

            <button class="btn btn-primary w-100 py-2">Search</button>
        </form>

        <p th:if="${error}" class="text-danger text-center mt-3" th:text="${error}"></p>
    </div>
</div>

</body>
</html>
