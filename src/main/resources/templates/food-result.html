<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Food Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <h3 class="text-center mb-3" th:text="${result.foodName}"></h3>

        <img th:if="${result.imageUrl}" th:src="${result.imageUrl}" class="img-fluid rounded mb-3"/>

        <h5 class="text-center text-muted" th:text="'Serving: ' + ${result.grams} + 'g'"></h5>

        <table class="table mt-3">
            <tr>
                <th>Calories</th>
                <td th:text="${#numbers.formatDecimal(result.calories, 1, 1)}"></td>
            </tr>
            <tr>
                <th>Protein</th>
                <td th:text="${#numbers.formatDecimal(result.protein, 1, 1)} + ' g'"></td>
            </tr>
            <tr>
                <th>Carbs</th>
                <td th:text="${#numbers.formatDecimal(result.carbs, 1, 1)} + ' g'"></td>
            </tr>
            <tr>
                <th>Fat</th>
                <td th:text="${#numbers.formatDecimal(result.fat, 1,1)} + ' g'"></td>
            </tr>
        </table>

        <div class="text-center mt-3">
            <a href="/food/search" class="btn btn-secondary">Search Again</a>
            <a href="/" class="btn btn-primary">Home</a>
        </div>
    </div>

</div>

</body>
</html>
