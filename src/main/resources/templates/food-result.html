<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Food Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .macro-box {
            border-radius: 10px;
            padding: 15px;
            color: white;
        }
        .cal { background: #ff7f50; }
        .pro { background: #32cd32; }
        .carb { background: #1e90ff; }
        .fat { background: #ff1493; }
    </style>
</head>

<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container py-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
        <h2 class="text-center fw-bold mb-3" th:text="${result.foodName}"></h2>

        <img th:if="${result.imageUrl}" th:src="${result.imageUrl}"
             class="img-fluid rounded mb-3" alt="Food Image">

        <h5 class="text-center text-muted"
            th:text="'Serving Size: ' + ${result.grams} + 'g'"></h5>

        <div class="row mt-4 g-3">
            <div class="col-md-6">
                <div class="macro-box cal text-center">
                    <h5>Calories</h5>
                    <h3 th:text="${#numbers.formatDecimal(result.calories,1,1)}"></h3>
                </div>
            </div>

            <div class="col-md-6">
                <div class="macro-box pro text-center">
                    <h5>Protein</h5>
                    <h3 th:text="${#numbers.formatDecimal(result.protein,1,1)} + ' g'"></h3>
                </div>
            </div>

            <div class="col-md-6">
                <div class="macro-box carb text-center">
                    <h5>Carbs</h5>
                    <h3 th:text="${#numbers.formatDecimal(result.carbs,1,1)} + ' g'"></h3>
                </div>
            </div>

            <div class="col-md-6">
                <div class="macro-box fat text-center">
                    <h5>Fat</h5>
                    <h3 th:text="${#numbers.formatDecimal(result.fat,1,1)} + ' g'"></h3>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/food/search" class="btn btn-dark px-4">Search Again</a>
        </div>
    </div>
</div>

</body>
</html>
